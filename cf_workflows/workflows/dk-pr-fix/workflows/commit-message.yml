# Authored for cf-workflows (#32); no upstream counterpart. See docs/drafting.md.
# Commit messages: a preset over the shared workflow. One draft-commit-message
# occurrence drafts a message for the checkout's uncommitted changes in a read-only
# session. Nothing is staged, committed or published.
name: cf-workflows:dk-commit-message
'on':
  workflow_call:
    inputs:
      request:
        # State-namespace path of the staged private request: requests/<sha256>.json.
        type: string
        required: true
      tasks:
        type: array
        default:
        - draft-commit-message
      finalizers:
        type: array
        default: []
      reviewers:
        type: array
        default: []
      adapters:
        type: object
        default:
          draft-commit-message:
            kind: task
            writes: false
            definition: leaf
            assignment: "Draft one commit message for the selected local changes in the assignment. Follow repository conventions, the commit template, recent human commits and any verified commit policy. Account for every changed path as included or excluded with a reason. Cite sources for every claim; claim no validation, issue or co-author that the evidence does not show. Do not stage, commit or publish."
            checklist:
            - id: assignment
              text: "Describe only the actual selected changes."
            - id: evidence
              text: "Cite the diff, history or policy behind every claim."
            - id: scope
              text: "Change no Git state; keep the user constraints exactly."
      limits:
        type: object
        default:
          review_cycles: 5
          retries_per_task: 1
          ci_repairs_per_cycle: 5
          ci_reruns_per_head: 3
          max_parallel_reviewers: 0
      permissions:
        type: object
        default: {}
      ci:
        type: object
        default:
          timeout_seconds: 1800
      merge_method:
        type: string
        default: merge
      accounts:
        type: array
        default: []
      settings:
        # settings.drafting.dk-commit-message: the entry options.
        type: object
        default: {}
      resources:
        type: array
        default: []
      turns:
        type: number
        default: 8
    secrets:
      github_token:
        required: true
    outputs:
      complete:
        value: ${{ jobs.drafting.outputs.complete }}
      ready:
        value: ${{ jobs.drafting.outputs.ready }}
      provisional:
        value: ${{ jobs.drafting.outputs.provisional }}
jobs:
  drafting:
    uses: workflows/main.yml
    with:
      request: ${{ inputs.request }}
      tasks: ${{ inputs.tasks }}
      finalizers: ${{ inputs.finalizers }}
      reviewers: ${{ inputs.reviewers }}
      adapters: ${{ inputs.adapters }}
      limits: ${{ inputs.limits }}
      permissions: ${{ inputs.permissions }}
      ci: ${{ inputs.ci }}
      merge_method: ${{ inputs.merge_method }}
      accounts: ${{ inputs.accounts }}
      settings: ${{ inputs.settings }}
      resources: ${{ inputs.resources }}
      turns: ${{ inputs.turns }}
      mode: fix
      entry: dk-commit-message
    secrets:
      github_token: ${{ secrets.github_token }}
