# Authored for cf-workflows (#29); no upstream counterpart. See docs/reviewer-skills.md.
# dk-pr-reviewers-run: incoming review's reviewer stage alone, in review mode. The stage and
# the empty finalizers are fixed here; the caller's ordered reviewer selection (parallel
# groups, repeated and optional occurrences) is the only selection. prepare rejects any other
# shape, an authorization or an enabled permission, and adds the separate verifier session.
name: cf-workflows:dk-pr-reviewers-run
'on':
  workflow_call:
    inputs:
      request:
        # State-namespace path of the staged private request: requests/<sha256>.json.
        type: string
        required: true
      reviewers:
        # Ordered reviewers and explicit parallel groups; no default (the entry needs a selection).
        type: array
        required: true
      adapters:
        type: object
        default:
          review:
            kind: review
            writes: false
            definition: reviewer
            assignment: "Review the actual changes against the originating issue, documented repository standards and accepted user scope. Return supported actionable findings or an evidenced no-findings report."
            checklist:
            - id: assignment
              text: "Inspect the actual diff and originating requirements."
            - id: evidence
              text: "Verify source evidence and every concrete finding."
            - id: scope
              text: "Account for repository rules, changed tests and unresolved checks."
          simplify:
            kind: review
            writes: false
            definition: reviewer
            assignment: "Review only the PR changes for bounded, behavior-preserving simplifications with a concrete maintainability benefit. Stay within changed hunks and agreed scope; report broader opportunities as deferred observations. Each finding states the complexity reduced, its scope and the verification it needs. Do not edit or publish."
            checklist:
            - id: assignment
              text: "Inspect the actual changed hunks and agreed scope."
            - id: evidence
              text: "Support every recommendation with source evidence and a concrete benefit."
            - id: scope
              text: "Keep behavior and public contracts; defer out-of-scope observations."
      limits:
        type: object
        default:
          review_cycles: 5
          retries_per_task: 1
          ci_repairs_per_cycle: 5
          ci_reruns_per_head: 3
          max_parallel_reviewers: 0
      permissions:
        type: object
        default:
          post_findings: false
          approve_pr: false
          approve_fork_ci: false
          merge: false
      ci:
        type: object
        default:
          timeout_seconds: 1800
      merge_method:
        type: string
        default: merge
      accounts:
        type: array
        default: []
      settings:
        type: object
        default: {}
      resources:
        type: array
        default: []
      turns:
        type: number
        default: 8
    secrets:
      github_token:
        required: true
    outputs:
      complete:
        value: ${{ jobs.reviewers.outputs.complete }}
      clean_review:
        value: ${{ jobs.reviewers.outputs.clean_review }}
      ready:
        value: ${{ jobs.reviewers.outputs.ready }}
      provisional:
        value: ${{ jobs.reviewers.outputs.provisional }}
jobs:
  reviewers:
    uses: workflows/main.yml
    with:
      request: ${{ inputs.request }}
      tasks:
      - stage: reviews
      finalizers: []
      reviewers: ${{ inputs.reviewers }}
      adapters: ${{ inputs.adapters }}
      limits: ${{ inputs.limits }}
      permissions: ${{ inputs.permissions }}
      ci: ${{ inputs.ci }}
      merge_method: ${{ inputs.merge_method }}
      accounts: ${{ inputs.accounts }}
      settings: ${{ inputs.settings }}
      resources: ${{ inputs.resources }}
      turns: ${{ inputs.turns }}
      mode: review
      entry: dk-pr-reviewers-run
    secrets:
      github_token: ${{ secrets.github_token }}
