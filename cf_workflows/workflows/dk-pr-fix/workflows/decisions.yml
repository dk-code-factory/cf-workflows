# Authored for cf-workflows (#28); no upstream counterpart. See docs/decisions.md.
# Sourced PR decisions: a preset over the shared workflow. Only the
# reconcile-decisions occurrence and the shared publication stage; no
# finalizers, no reviewers, and only the bounded section's edit_pr input.
name: cf-workflows:dk-pr-decisions
'on':
  workflow_call:
    inputs:
      request:
        # State-namespace path of the staged private request: requests/<sha256>.json.
        type: string
        required: true
      tasks:
        type: array
        default:
        - reconcile-decisions
        - stage: publication
      finalizers:
        type: array
        default: []
      reviewers:
        type: array
        default: []
      adapters:
        type: object
        default:
          reconcile-decisions:
            kind: decisions
            writes: false
            definition: leaf
            assignment: "Reconcile settled decisions from original sources, exact request and repository guidance; do not invent user authority."
      limits:
        type: object
        default:
          review_cycles: 5
          retries_per_task: 1
          ci_repairs_per_cycle: 5
          ci_reruns_per_head: 3
          max_parallel_reviewers: 0
      permissions:
        type: object
        default:
          edit_pr: false
      ci:
        type: object
        default:
          timeout_seconds: 1800
      merge_method:
        type: string
        default: merge
      accounts:
        type: array
        default: []
      settings:
        type: object
        default: {}
      resources:
        type: array
        default: []
      turns:
        type: number
        default: 8
    secrets:
      github_token:
        required: true
    outputs:
      complete:
        value: ${{ jobs.decisions.outputs.complete }}
      ready:
        value: ${{ jobs.decisions.outputs.ready }}
      provisional:
        value: ${{ jobs.decisions.outputs.provisional }}
jobs:
  decisions:
    uses: workflows/main.yml
    with:
      request: ${{ inputs.request }}
      tasks: ${{ inputs.tasks }}
      finalizers: ${{ inputs.finalizers }}
      reviewers: ${{ inputs.reviewers }}
      adapters: ${{ inputs.adapters }}
      limits: ${{ inputs.limits }}
      permissions: ${{ inputs.permissions }}
      ci: ${{ inputs.ci }}
      merge_method: ${{ inputs.merge_method }}
      accounts: ${{ inputs.accounts }}
      settings: ${{ inputs.settings }}
      resources: ${{ inputs.resources }}
      turns: ${{ inputs.turns }}
      mode: fix
    secrets:
      github_token: ${{ secrets.github_token }}
