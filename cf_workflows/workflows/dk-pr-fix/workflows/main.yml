# Adapted from Agent Workflow examples/pr-fix (MIT); see ../LICENSE and ../../../../baselines/dk-pr-fix-closure.json.
# Checked-in orchestration; helper calls retain separate operation boundaries.
name: cf-workflows:dk-pr-fix
'on':
  workflow_call:
    inputs:
      request:
        # State-namespace path of the staged private request: requests/<sha256>.json.
        type: string
        required: true
      tasks:
        type: array
        default:
        - read-feedback
        - reconcile-decisions
        - address-feedback
        - stage: publication
        - stage: responses
        - assess-scope
        - describe-pr
        - stage: reviews
        - stage: publication
      finalizers:
        type: array
        default:
        - inspect-commits
        - sync-guidance
        - stage: responses
        - stage: ci
      reviewers:
        type: array
        default:
        - review
      adapters:
        type: object
        default:
          read-feedback:
            kind: inspection
            writes: false
            assignment: Capture all actionable inline threads, review bodies and general comments; preserve source
              identities and obligations.
            definition: leaf
          reconcile-decisions:
            kind: decisions
            writes: false
            assignment: Reconcile settled decisions from original sources, exact request and repository guidance;
              do not invent user authority.
            definition: leaf
          address-feedback:
            kind: fix
            writes: true
            assignment: Verify actionable feedback and implement focused changes. Account for original findings
              and every changed file; preserve unrelated work.
            definition: leaf
          assess-scope:
            kind: scope
            writes: false
            assignment: Assess the complete diff against the selected size/scope policies; report concrete boundaries
              and ownership evidence. Splitting publication requires separately supplied explicit authority.
            definition: leaf
          describe-pr:
            kind: description
            writes: false
            assignment: Prepare a repository-native PR title and description from the actual final diff and accepted
              issue; propose exact authorized publication operations only.
            definition: leaf
          inspect-commits:
            kind: cleanup
            writes: false
            assignment: Inspect the entire commit series against selected commit policy and final tree. Report blockers
              and exact justified history proposals; do not rewrite Git directly.
            definition: leaf
          sync-guidance:
            kind: synchronization
            writes: true
            assignment: Synchronize governing repository content only where the exact original request and selected
              policy require changes; account for every changed path.
            definition: leaf
          reply-feedback:
            kind: reply
            writes: false
            assignment: "Assess every feedback source against the published changes: quote each request, its addressee, implementation disposition and response disposition. Draft one exact reply for each source that needs an answer. Do not publish. Reply prompt: Keep replies concise. When it is simply fixed, reply with \"Addressed\", \"Agreed, fixed\", \"Done\", or similar. Use your judgment about whether more detail is necessary; stay concise when you add it. Never mention the fixing commit's ID or link to that commit. When referencing code, use a GitHub permalink pinned to a full commit SHA with line anchors, never a branch URL or branch-relative reference. Keep internal workflow details private."
            definition: leaf
          review:
            kind: review
            definition: reviewer
            writes: false
            assignment: Review the actual changes against the originating issue, documented repository standards
              and accepted user scope. Return supported actionable findings or an evidenced no-findings report.
            checklist:
            - id: assignment
              text: Inspect the actual diff and originating requirements.
            - id: evidence
              text: Verify source evidence and every concrete finding.
            - id: scope
              text: Account for repository rules, changed tests and unresolved checks.
            resources: []
            history: false
            head_sensitive: false
            cacheable: true
      limits:
        type: object
        default:
          review_cycles: 5
          retries_per_task: 1
          ci_repairs_per_cycle: 5
          ci_reruns_per_head: 3
          max_parallel_reviewers: 0
      permissions:
        type: object
        default:
          push_commits: false
          rewrite_commits: false
          edit_pr: false
          reply_to_feedback: false
          resolve_threads: false
          create_draft_prs: false
          request_review: false
          post_findings: false
          rerun_ci: false
          approve_pr: false
          approve_fork_ci: false
          merge: false
          create_issue: false
          edit_issue: false
      ci:
        type: object
        default:
          timeout_seconds: 1800
      merge_method:
        type: string
        default: merge
      accounts:
        type: array
        default: []
      settings:
        type: object
        default: {}
      resources:
        type: array
        default: []
      turns:
        type: number
        default: 8
      prompts:
        # Semantically accepted custom prompts and preferences: {id, slot, target, text[, scope]}
        # (cf_workflows.semantic; docs/semantic.md#installed-workflow). Empty without custom inputs.
        type: array
        default: []
      policy:
        # Semantically accepted free-text {requirements, prohibitions}; empty without them.
        type: object
        default: {}
      mode:
        # fix maintains the PR; review is incoming review (workflows/review.yml).
        type: string
        default: fix
      validation_commands:
        # Argument arrays an address-feedback session runs in the checkout besides its relevant
        # checks (dk-pr-feedback-address's additional_validation_commands; workflows/feedback-address.yml).
        type: array
        default: []
      entry:
        # A direct publication entry (workflows/publish.yml, review-post.yml), reviewer
        # entry (reviewers-run.yml, code-simplify.yml), drafting entry (description.yml,
        # commit-message.yml, issue.yml) or splitting entry (commit-split.yml, pr-split.yml)
        # whose preset prepare enforces; empty for dk-pr-fix and dk-pr-review.
        type: string
        default: ''
    secrets:
      github_token:
        required: true
    outputs:
      complete:
        value: ${{ jobs.completion.outputs.result.complete }}
      ready:
        value: ${{ jobs.completion.outputs.result.ready }}
      provisional:
        value: ${{ jobs.completion.outputs.result.provisional.provisional }}
      clean_review:
        value: ${{ jobs.completion.outputs.result.clean_review }}
jobs:
  request:
    uses: workflows/helper.yml
    with:
      operation: snapshot_request
      payload:
        request: ${{ inputs.request }}
    secrets:
      github_token: ${{ secrets.github_token }}
  prepare:
    uses: workflows/helper.yml
    with:
      operation: prepare
      payload:
        snapshot: ${{ needs.request.outputs.result.snapshot }}
        controls:
          tasks: ${{ inputs.tasks }}
          finalizers: ${{ inputs.finalizers }}
          reviewers: ${{ inputs.reviewers }}
          adapters: ${{ inputs.adapters }}
          limits: ${{ inputs.limits }}
          permissions: ${{ inputs.permissions }}
          ci: ${{ inputs.ci }}
          merge_method: ${{ inputs.merge_method }}
          accounts: ${{ inputs.accounts }}
          settings: ${{ inputs.settings }}
          resources: ${{ inputs.resources }}
          turns: ${{ inputs.turns }}
          prompts: ${{ inputs.prompts }}
          policy: ${{ inputs.policy }}
          mode: ${{ inputs.mode }}
          validation_commands: ${{ inputs.validation_commands }}
          entry: ${{ inputs.entry }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs:
    - request
  alignment_gate:
    # Current alignment (#23): read-only, before any review stage. Retained
    # alternatives analysis of this PR that does not release review at the
    # analyzed revision keeps the review partial and the run unready (coverage
    # re-reads it each cycle); it never starts or repeats an architectural
    # stage. An unreadable or foreign record stops the run here.
    uses: workflows/helper.yml
    with:
      operation: alignment_gate
      payload:
        plan: ${{ needs.prepare.outputs.result.plan }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs: prepare
    if: ${{ needs.prepare.status != 'failed' and needs.prepare.status != 'needs_attention' and needs.prepare.status
      != 'canceled' }}
  cycles:
    uses: workflows/cycle.yml
    with:
      plan: ${{ needs.prepare.outputs.result.plan }}
      stages: ${{ needs.prepare.outputs.result.stages }}
      cycle: ${{ iteration.number }}
      repairs: ${{ needs.prepare.outputs.result.limits.ci_repairs_per_cycle }}
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs:
    - prepare
    - alignment_gate
    if: ${{ needs.alignment_gate.status == 'succeeded' }}
    repeat:
      max-attempts: ${{ needs.prepare.outputs.result.limits.review_cycles }}
      until: ${{ iteration.outputs.settled }}
  findings:
    # Incoming review: independently verified findings, published once as inline
    # comments and body findings. Partial coverage only comments (findings.py).
    uses: workflows/publication-barrier.yml
    with:
      plan: ${{ needs.prepare.outputs.result.plan }}
      selector: findings
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs:
    - prepare
    - cycles
    if: ${{ needs.prepare.outputs.result.findings_authorized and needs.cycles.status != 'canceled' }}
  approval_proposal:
    # Incoming review: a separately authorized approval of the exact head once the
    # review is complete and clean; never implied by findings or merge.
    uses: workflows/helper.yml
    with:
      operation: approval_proposal
      payload:
        plan: ${{ needs.prepare.outputs.result.plan }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs:
    - prepare
    - cycles
    if: ${{ needs.prepare.outputs.result.approval_authorized and needs.cycles.status != 'canceled' }}
  approve:
    uses: workflows/publication.yml
    with:
      plan: ${{ needs.prepare.outputs.result.plan }}
      proposal: ${{ needs.approval_proposal.outputs.result.proposal }}
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs:
    - prepare
    - approval_proposal
    if: ${{ needs.prepare.outputs.result.approval_authorized and needs.approval_proposal.outputs.result.invoke }}
  fork_ci:
    # Incoming review: separately authorized fork workflow approvals (#35), one
    # exact intent per eligible run attempt once the review and its finding
    # publication settle; never implied by findings, approval or merge.
    uses: workflows/publication-barrier.yml
    with:
      plan: ${{ needs.prepare.outputs.result.plan }}
      selector: fork_ci
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs:
    - prepare
    - cycles
    - findings
    if: ${{ needs.prepare.outputs.result.fork_ci_authorized and needs.cycles.status != 'canceled' and needs.findings.status
      != 'failed' and needs.findings.status != 'needs_attention' and needs.findings.status != 'canceled' }}
  completion:
    uses: workflows/helper.yml
    with:
      operation: completion
      payload:
        plan: ${{ needs.prepare.outputs.result.plan }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs:
    - prepare
    - cycles
  merge_ci:
    # Standalone-to-merge bridge (#35): after a complete, clean and verified review
    # and any separately authorized fork approvals settle, wait for exact-head CI
    # within that head's retained window. A timeout fails this job, so the merge
    # is skipped; an unclean review never waits.
    uses: workflows/ci-poll.yml
    with:
      plan: ${{ needs.prepare.outputs.result.plan }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs:
    - prepare
    - completion
    - fork_ci
    if: ${{ needs.prepare.outputs.result.merge_authorized and needs.completion.outputs.result.complete and needs.completion.outputs.result.clean_review
      and needs.completion.outputs.result.verified and needs.fork_ci.status != 'failed' and needs.fork_ci.status != 'needs_attention'
      and needs.fork_ci.status != 'canceled' }}
    repeat:
      max-attempts: 100
      until: ${{ iteration.outputs.settled }}
  merge_readiness:
    # Fresh readiness after the bridge; merge never relies on the earlier completion.
    uses: workflows/helper.yml
    with:
      operation: completion
      payload:
        plan: ${{ needs.prepare.outputs.result.plan }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs:
    - prepare
    - merge_ci
    if: ${{ needs.prepare.outputs.result.merge_authorized and needs.merge_ci.status == 'succeeded' }}
  merge_proposal:
    uses: workflows/helper.yml
    with:
      operation: merge_proposal
      payload:
        plan: ${{ needs.prepare.outputs.result.plan }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs:
    - prepare
    - merge_readiness
    if: ${{ needs.prepare.outputs.result.merge_authorized and needs.merge_readiness.outputs.result.ready }}
  merge:
    uses: workflows/publication.yml
    with:
      plan: ${{ needs.prepare.outputs.result.plan }}
      proposal: ${{ needs.merge_proposal.outputs.result.proposal }}
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs:
    - prepare
    - merge_proposal
    if: ${{ needs.prepare.outputs.result.merge_authorized and needs.merge_proposal.outputs.result.invoke }}
