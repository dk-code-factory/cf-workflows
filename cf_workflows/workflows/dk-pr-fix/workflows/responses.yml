# cf-workflows response stage (#21); see ../../../../docs/responses.md.
# Settles feedback replies after fixes publish and before independent review.
name: Feedback responses through exact intents
'on':
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
      stage:
        type: object
        required: true
      cycle:
        type: number
        required: true
      turns:
        type: number
        default: 8
    secrets:
      github_token:
        required: true
    outputs:
      status:
        value: ${{ jobs.status.outputs.result.status }}
jobs:
  responder:
    uses: workflows/task.yml
    with:
      plan: ${{ inputs.plan }}
      task: ${{ inputs.stage.task }}
      cycle: ${{ inputs.cycle }}
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
  replies:
    needs: responder
    uses: workflows/helper.yml
    with:
      operation: publication_list
      payload:
        plan: ${{ inputs.plan }}
        kind: responses
    secrets:
      github_token: ${{ secrets.github_token }}
  reply:
    needs: replies
    uses: workflows/publication.yml
    for-each:
      items: ${{ needs.replies.outputs.result.items }}
      key: ${{ item.id }}
      concurrency: 1
    with:
      plan: ${{ inputs.plan }}
      proposal: ${{ item }}
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
  settle:
    needs: reply
    uses: workflows/helper.yml
    with:
      operation: responses_settle
      payload:
        plan: ${{ inputs.plan }}
    secrets:
      github_token: ${{ secrets.github_token }}
  resolutions:
    needs: settle
    uses: workflows/helper.yml
    with:
      operation: publication_list
      payload:
        plan: ${{ inputs.plan }}
        kind: responses
    secrets:
      github_token: ${{ secrets.github_token }}
  resolve:
    needs: resolutions
    uses: workflows/publication.yml
    for-each:
      items: ${{ needs.resolutions.outputs.result.items }}
      key: ${{ item.id }}
      concurrency: 1
    with:
      plan: ${{ inputs.plan }}
      proposal: ${{ item }}
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
  status:
    needs: resolve
    uses: workflows/helper.yml
    with:
      operation: responses_status
      payload:
        plan: ${{ inputs.plan }}
    secrets:
      github_token: ${{ secrets.github_token }}
