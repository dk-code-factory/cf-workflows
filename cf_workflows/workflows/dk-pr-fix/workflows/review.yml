# Authored for cf-workflows (#24); no upstream counterpart. See docs/review.md.
# Incoming review: a preset over the shared workflow in review mode. Read-only
# tasks and reviewers, a separate independent verifier, and no finding fixes.
name: cf-workflows:dk-pr-review
'on':
  workflow_call:
    inputs:
      request:
        # State-namespace path of the staged private request: requests/<sha256>.json.
        type: string
        required: true
      tasks:
        type: array
        default:
        - read-feedback
        - stage: reviews
      finalizers:
        type: array
        default: []
      reviewers:
        type: array
        default:
        - - review
          - simplify
      adapters:
        type: object
        default:
          read-feedback:
            kind: inspection
            writes: false
            definition: leaf
            assignment: "Capture all actionable inline threads, review bodies and general comments; preserve source identities and obligations."
          review:
            kind: review
            writes: false
            definition: reviewer
            assignment: "Review the actual changes against the originating issue, documented repository standards and accepted user scope. Return supported actionable findings or an evidenced no-findings report."
            checklist:
            - id: assignment
              text: "Inspect the actual diff and originating requirements."
            - id: evidence
              text: "Verify source evidence and every concrete finding."
            - id: scope
              text: "Account for repository rules, changed tests and unresolved checks."
          simplify:
            kind: review
            writes: false
            definition: reviewer
            assignment: "Review only the PR changes for bounded, behavior-preserving simplifications with a concrete maintainability benefit. Stay within changed hunks and agreed scope; report broader opportunities as deferred observations. Each finding states the complexity reduced, its scope and the verification it needs. Do not edit or publish."
            checklist:
            - id: assignment
              text: "Inspect the actual changed hunks and agreed scope."
            - id: evidence
              text: "Support every recommendation with source evidence and a concrete benefit."
            - id: scope
              text: "Keep behavior and public contracts; defer out-of-scope observations."
      limits:
        type: object
        default:
          review_cycles: 5
          retries_per_task: 1
          ci_repairs_per_cycle: 5
          ci_reruns_per_head: 3
      permissions:
        type: object
        default:
          merge: false
      ci:
        type: object
        default:
          timeout_seconds: 1800
      merge_method:
        type: string
        default: merge
      accounts:
        type: array
        default: []
      settings:
        type: object
        default: {}
      resources:
        type: array
        default: []
      turns:
        type: number
        default: 8
    secrets:
      github_token:
        required: true
    outputs:
      complete:
        value: ${{ jobs.review.outputs.complete }}
      clean_review:
        value: ${{ jobs.review.outputs.clean_review }}
      ready:
        value: ${{ jobs.review.outputs.ready }}
      provisional:
        value: ${{ jobs.review.outputs.provisional }}
jobs:
  review:
    uses: workflows/main.yml
    with:
      request: ${{ inputs.request }}
      tasks: ${{ inputs.tasks }}
      finalizers: ${{ inputs.finalizers }}
      reviewers: ${{ inputs.reviewers }}
      adapters: ${{ inputs.adapters }}
      limits: ${{ inputs.limits }}
      permissions: ${{ inputs.permissions }}
      ci: ${{ inputs.ci }}
      merge_method: ${{ inputs.merge_method }}
      accounts: ${{ inputs.accounts }}
      settings: ${{ inputs.settings }}
      resources: ${{ inputs.resources }}
      turns: ${{ inputs.turns }}
      mode: review
    secrets:
      github_token: ${{ secrets.github_token }}
