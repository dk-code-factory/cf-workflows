# Authored for cf-workflows (#34); no upstream counterpart. See docs/splitting.md.
# Commit organization: a preset over the shared workflow. Each inspect-commits pass
# assesses every commit in a read-only session; the helpers check the proposed series,
# build it under the explicit local rewrite grant, validate each new commit
# (splitting.yml) and publish the rewrite only under push and rewrite_commits.
name: cf-workflows:dk-commit-split
'on':
  workflow_call:
    inputs:
      request:
        # State-namespace path of the staged private request: requests/<sha256>.json.
        type: string
        required: true
      tasks:
        type: array
        default:
        - inspect-commits
        - stage: publication
      finalizers:
        type: array
        default: []
      reviewers:
        type: array
        default: []
      adapters:
        type: object
        default:
          inspect-commits:
            kind: cleanup
            writes: false
            definition: leaf
            assignment: "Inspect the entire commit series against selected commit policy and final tree. Report blockers and exact justified history proposals; do not rewrite Git directly."
      limits:
        type: object
        default:
          review_cycles: 5
          retries_per_task: 1
          ci_repairs_per_cycle: 5
          ci_reruns_per_head: 3
          max_parallel_reviewers: 0
      permissions:
        type: object
        default:
          rewrite_commits: false
      ci:
        type: object
        default:
          timeout_seconds: 1800
      merge_method:
        type: string
        default: merge
      accounts:
        type: array
        default: []
      settings:
        # settings.splitting.dk-commit-split: the entry options, the local rewrite grant,
        # further owned authors and the validation commands of each new commit.
        type: object
        default: {}
      resources:
        type: array
        default: []
      turns:
        type: number
        default: 8
    secrets:
      github_token:
        required: true
    outputs:
      complete:
        value: ${{ jobs.splitting.outputs.complete }}
      ready:
        value: ${{ jobs.splitting.outputs.ready }}
      provisional:
        value: ${{ jobs.splitting.outputs.provisional }}
jobs:
  splitting:
    uses: workflows/main.yml
    with:
      request: ${{ inputs.request }}
      tasks: ${{ inputs.tasks }}
      finalizers: ${{ inputs.finalizers }}
      reviewers: ${{ inputs.reviewers }}
      adapters: ${{ inputs.adapters }}
      limits: ${{ inputs.limits }}
      permissions: ${{ inputs.permissions }}
      ci: ${{ inputs.ci }}
      merge_method: ${{ inputs.merge_method }}
      accounts: ${{ inputs.accounts }}
      settings: ${{ inputs.settings }}
      resources: ${{ inputs.resources }}
      turns: ${{ inputs.turns }}
      mode: fix
      entry: dk-commit-split
    secrets:
      github_token: ${{ secrets.github_token }}
