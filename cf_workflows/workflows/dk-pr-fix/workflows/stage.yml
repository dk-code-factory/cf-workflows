# Checked-in orchestration; helpers validate data and retain evidence.
name: Select a declared stage kind
'on':
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
      stage:
        type: object
        required: true
      cycle:
        type: number
        required: true
      repairs:
        type: number
        required: true
      turns:
        type: number
        default: 8
    secrets:
      github_token:
        required: true
jobs:
  tasks:
    uses: workflows/batch.yml
    with:
      plan: ${{ inputs.plan }}
      groups: ${{ inputs.stage.groups }}
      review: ${{ inputs.stage.review }}
      fix: ${{ inputs.stage.fix }}
      cycle: ${{ inputs.cycle }}
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
    if: ${{ inputs.stage.kind == 'tasks' or inputs.stage.kind == 'reviews' }}
  decisions:
    # A tasks stage with the reconcile-decisions occurrence settles its decisions before the next stage.
    uses: workflows/reconciliation.yml
    with:
      plan: ${{ inputs.plan }}
      task: ${{ inputs.stage.decisions }}
      cycle: ${{ inputs.cycle }}
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs: tasks
    if: ${{ inputs.stage.kind == 'tasks' and inputs.stage.decisions and needs.tasks.status == 'succeeded' }}
  splitting:
    # A splitting entry's publication stage first builds, validates and applies its
    # local operation (splitting.yml); the barrier then lists only its exact intents.
    uses: workflows/splitting.yml
    with:
      plan: ${{ inputs.plan }}
    secrets:
      github_token: ${{ secrets.github_token }}
    if: ${{ inputs.stage.kind == 'publication' and inputs.stage.splitting }}
  publication:
    uses: workflows/publication-barrier.yml
    with:
      plan: ${{ inputs.plan }}
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs: splitting
    if: ${{ inputs.stage.kind == 'publication' and needs.splitting.status != 'failed' and needs.splitting.status != 'needs_attention'
      and needs.splitting.status != 'canceled' }}
  identities:
    # CI belongs to the PR metadata head; while analysis is provisional it is
    # neither observed nor repaired, and coverage reports current-head CI missing.
    uses: workflows/helper.yml
    with:
      operation: alignment
      payload:
        plan: ${{ inputs.plan }}
        wait: false
    secrets:
      github_token: ${{ secrets.github_token }}
    if: ${{ inputs.stage.kind == 'ci' }}
  responses:
    uses: workflows/responses.yml
    with:
      plan: ${{ inputs.plan }}
      stage: ${{ inputs.stage }}
      cycle: ${{ inputs.cycle }}
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
    if: ${{ inputs.stage.kind == 'responses' }}
  ci:
    uses: workflows/ci-pass.yml
    with:
      plan: ${{ inputs.plan }}
      cycle: ${{ inputs.cycle }}
      repair: true
      bound: ${{ inputs.repairs }}
      number: ${{ iteration.number }}
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs: identities
    if: ${{ inputs.stage.kind == 'ci' and inputs.repairs > 0 and needs.identities.outputs.result.current }}
    repeat:
      max-attempts: ${{ inputs.repairs }}
      until: ${{ iteration.outputs.settled }}
  ci_final:
    uses: workflows/ci-pass.yml
    with:
      plan: ${{ inputs.plan }}
      cycle: ${{ inputs.cycle }}
      repair: false
      turns: ${{ inputs.turns }}
    secrets:
      github_token: ${{ secrets.github_token }}
    needs:
    - identities
    - ci
    if: ${{ inputs.stage.kind == 'ci' and needs.identities.outputs.result.current and needs.ci.status != 'failed' and needs.ci.status != 'needs_attention'
      and needs.ci.status != 'canceled' }}
