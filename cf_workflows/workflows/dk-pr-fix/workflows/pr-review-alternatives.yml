# Authored for cf-workflows (#27); no upstream counterpart. See docs/alternatives.md.
# The manual dk-pr-review-alternatives entry: the staged request is the distinct
# direct user request for a fresh comparison of the branch analysis, then current
# alignment, independent verification and the alignment gate. It stops there.
name: cf-workflows:dk-pr-review-alternatives
'on':
  workflow_call:
    inputs:
      request:
        # State-namespace path of the staged private request: requests/<sha256>.json.
        type: string
        required: true
      tasks:
        type: array
        default:
        - pr-alternatives
      finalizers:
        type: array
        default: []
      reviewers:
        type: array
        default: []
      adapters:
        type: object
        default:
          pr-alternatives:
            kind: alternatives
            writes: false
            definition: leaf
            assignment: "Perform only the assigned alternatives stage for the architecture of the whole pull-request branch, including inherited decisions. Estimate every option against the pinned target revision, counting work already on the branch. Return the stage contract with source evidence; do not edit, commit or publish."
            checklist:
            - id: assignment
              text: "Perform the assigned stage only, over the whole branch."
            - id: evidence
              text: "Cite repository files for every decision and option."
            - id: scope
              text: "Keep comparisons private; a selection grants no edit or publication permission."
      limits:
        type: object
        default:
          review_cycles: 5
          retries_per_task: 1
          ci_repairs_per_cycle: 5
          ci_reruns_per_head: 3
          max_parallel_reviewers: 0
      permissions:
        type: object
        default: {}
      ci:
        type: object
        default:
          timeout_seconds: 1800
      merge_method:
        type: string
        default: merge
      accounts:
        type: array
        default: []
      settings:
        # settings.alternatives: requirements, options (prfix/alternatives.py).
        type: object
        default: {}
      resources:
        type: array
        default: []
      turns:
        type: number
        default: 8
    secrets:
      github_token:
        required: true
    outputs:
      complete:
        value: ${{ jobs.alternatives.outputs.complete }}
      ready:
        value: ${{ jobs.alternatives.outputs.ready }}
      provisional:
        value: ${{ jobs.alternatives.outputs.provisional }}
jobs:
  alternatives:
    uses: workflows/main.yml
    with:
      request: ${{ inputs.request }}
      tasks: ${{ inputs.tasks }}
      finalizers: ${{ inputs.finalizers }}
      reviewers: ${{ inputs.reviewers }}
      adapters: ${{ inputs.adapters }}
      limits: ${{ inputs.limits }}
      permissions: ${{ inputs.permissions }}
      ci: ${{ inputs.ci }}
      merge_method: ${{ inputs.merge_method }}
      accounts: ${{ inputs.accounts }}
      settings: ${{ inputs.settings }}
      resources: ${{ inputs.resources }}
      turns: ${{ inputs.turns }}
      mode: review
      entry: dk-pr-review-alternatives
    secrets:
      github_token: ${{ secrets.github_token }}
