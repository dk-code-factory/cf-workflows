  - name: dk-pr-approvers
    path: skills/dk-pr-approvers/SKILL.md
    workflow: workflows/approvers.yml
  - name: dk-pr-description
    path: skills/dk-pr-description/SKILL.md
    workflow: workflows/description.yml
  - name: dk-commit-message
    path: skills/dk-commit-message/SKILL.md
