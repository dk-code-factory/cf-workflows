  - name: dk-config
    path: skills/dk-config/SKILL.md
    workflow: workflows/config.yml
  - name: dk-preferences
    path: skills/dk-preferences/SKILL.md
    workflow: workflows/preferences.yml
resources:
  - LICENSE
  - agents.yml
  # Preflight's semantic assessment of custom inputs (cf_workflows.validator_binding).
  - workflows/assess.yml
  - workflows/validator/configuration-validator.yaml
  - closure.json
  - request.example.json
