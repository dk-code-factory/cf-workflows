# The one cf-workflows plugin descriptor (Agent Workflow plugin.yaml, schema 1).
# Agent Workflow's shared toolchain generates host manifests, launchers and
# catalogs from it; none are maintained here. See docs/packaging.md.
schema-version: 1
name: cf-workflows
version: 0.1.0-dev
engine-version: 0.2.2
hosts: [codex, claude]
skills:
  - name: dk-pr-fix
    path: skills/dk-pr-fix/SKILL.md
    workflow: workflows/main.yml
  - name: dk-pr-review
    path: skills/dk-pr-review/SKILL.md
    workflow: workflows/review.yml
  - name: dk-pr-feedback-read
    path: skills/dk-pr-feedback-read/SKILL.md
    workflow: workflows/feedback-read.yml
  - name: dk-pr-feedback-address
    path: skills/dk-pr-feedback-address/SKILL.md
    workflow: workflows/feedback-address.yml
  - name: dk-pr-feedback-reply
    path: skills/dk-pr-feedback-reply/SKILL.md
    workflow: workflows/feedback-reply.yml
  - name: dk-pr-publish
    path: skills/dk-pr-publish/SKILL.md
    workflow: workflows/publish.yml
  - name: dk-pr-review-post
    path: skills/dk-pr-review-post/SKILL.md
    workflow: workflows/review-post.yml
  - name: dk-plain-english
    path: skills/dk-plain-english/SKILL.md
    workflow: workflows/plain-english.yml
  - name: dk-asd-ste100
    path: skills/dk-asd-ste100/SKILL.md
    workflow: workflows/asd-ste100.yml
  - name: dk-pr-decisions
    path: skills/dk-pr-decisions/SKILL.md
    workflow: workflows/decisions.yml
resources:
  - LICENSE
  - agents.yml
  - closure.json
  - request.example.json
